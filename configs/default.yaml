seed: 0
runs_dir: runs

data:
  root: data/synthetic          # produced by scripts/make_dataset.py
  image_size: 192               # frames are resized to this (mm/px is rescaled accordingly)

synthetic:
  n_animals: 900                # ~1800 frames (1-3 frames per animal), split by animal
  seed: 0
  # A harder "domain-shift" test set: noisier scanner, more shadowing, poorer contact.
  shift_test:
    n_animals: 120
    seed: 999
    acquisition:
      gain_db: [-14.0, 4.0]
      dynamic_range_db: [40.0, 70.0]
      speckle_lateral_px: [2.5, 5.5]
      attenuation_db_per_mm: [0.05, 0.14]
      shadow_prob: 0.9
      shadow_strength: [0.5, 0.95]
      contact_loss_prob: 0.4
      electronic_noise: [0.02, 0.06]

seg_model:
  name: unet                    # or resnet18_unet (ImageNet-pretrained encoder)
  kwargs: {in_ch: 1, n_classes: 3, base: 16, depth: 4, dropout: 0.1}

reg_model:
  kwargs: {in_ch: 1, n_outputs: 4}

train:
  epochs: 12
  batch_size: 8
  lr: 0.002
  weight_decay: 0.0001
  augment: true
  num_workers: 0
