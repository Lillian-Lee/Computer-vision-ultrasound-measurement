name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: end-to-end smoke (tiny synthetic set, 1 epoch)
        run: |
          python scripts/make_dataset.py --n-animals 20 --config configs/smoke.yaml
          python -m cvmeasure.train --task seg --config configs/smoke.yaml --epochs 1
          python -m cvmeasure.evaluate --seg runs_smoke/seg/best.pt --data data/smoke --out reports/smoke
