[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvmeasure"
version = "0.1.0"
description = "Computer vision for ultrasound measurement: U-Net segmentation to millimetre measurements, with a sheep eye-muscle case study"
authors = [{name = "Lillian Lee", email = "lillian00lee@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "scikit-image", "opencv-python-headless", "torch", "torchvision",
  "pyyaml", "matplotlib", "pandas", "tqdm", "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
ignore = ["E702", "E731", "E402", "E741"]
